<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos · Gauss</title>
<style>
:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--verde:#1b8a3a;--borde:#e3e3e3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:15px}
header{background:var(--negro);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--rojo)}
header h1{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}header h1 b{flex:1;font-size:19px}
#bInicio{display:none;background:#444;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:bold}header h1 span{color:#ff6b5e}
#q{width:100%;font-size:17px;padding:11px 12px;border:0;border-radius:8px}
#res{background:#fff;border-radius:8px;margin-top:6px;max-height:60vh;overflow:auto;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#res div{padding:11px 12px;border-bottom:1px solid #eee;color:#222;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#res div:hover{background:#fdecea}#res small{color:#777}
.badge{font-size:12px;font-weight:bold;padding:3px 8px;border-radius:10px;white-space:nowrap;align-self:center}
.bR{background:#f4cccc;color:#990000}.bG{background:#d9ead3;color:#274e13}
main{padding:12px 16px 60px;max-width:860px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 8px;font-size:15px;color:var(--rojo)}
.nom{font-size:21px;font-weight:bold;margin:0}.sub{color:#555;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.k{background:var(--fondo);border-radius:8px;padding:8px}.k span{font-size:11px;color:#666;text-transform:uppercase}.k b{display:block;font-size:18px;margin-top:2px}
.b{background:#cfe2f3}.r{background:#f4cccc}.y{background:#fff2cc}.g{background:#d9ead3}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--negro);color:#fff;text-align:left;padding:6px}
td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}.n{text-align:right;white-space:nowrap}
.btn{display:block;width:100%;font-size:17px;padding:13px;background:var(--rojo);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:.6}.btn2{background:var(--negro)}
.mini{font-size:12px;padding:4px 8px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
form label{display:block;font-weight:bold;margin-top:10px;font-size:13px}
form input,form select{width:100%;font-size:16px;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:3px;background:#fff}
.fila{display:flex;gap:10px}.fila>div{flex:1}
@media(max-width:560px){.fila{flex-direction:column;gap:0}}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:9px 14px;border-radius:18px;margin:8px 8px 0 0;font-weight:bold;font-size:14px}
.wa.gr{background:#555}.wa.az{background:#1f4e79}
.ok{background:#d9ead3;border-radius:10px;padding:12px;margin-bottom:12px}
.err{color:var(--rojo);font-weight:bold;margin-top:8px}
.vacio{color:#999;font-style:italic}
#msg{color:#666;text-align:center;margin-top:30px}
.ayuda{color:#777;font-size:12px;font-weight:normal}
h1 .tit{cursor:pointer;-webkit-tap-highlight-color:transparent}h1 .tit:active{opacity:.6}
</style></head><body>
<header><h1><b class="tit" onclick="aInicio()" title="Ir al inicio">💵 Pagos <span>Gauss</span></b><button id="bInicio" onclick="aInicio()">🏠 Inicio</button></h1>
<input id="q" placeholder="Buscá al alumno por nombre, apellido o ID…" autocomplete="off" oninput="filtrar()">
<div id="res"></div></header>
<main><div id="pend"></div><div id="ficha"></div><div id="msg">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var PIN='';try{PIN=localStorage.getItem('gaussPinSec')||'';}catch(e){}
var L=null,F=null,ULTIMO=null;
// ⚡ Supabase: copia rápida (solo lectura). Si falla o no está, se usa la planilla como siempre.
var SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI';
var VER_N=0,TOCADO=false,NUEVO=null;
function sbLeer(tipo,clave,ok,mal){
 if(!PIN){mal();return;}
 var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);
 fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:clave})})
 .then(function(r){return r.json();})
 .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})
 .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});
}
function estable(o){if(Array.isArray(o))return '['+o.map(estable).join(',')+']';
 if(o&&typeof o==='object')return '{'+Object.keys(o).filter(function(k){return k!=='ultFactura'&&k!=='_ms'&&k!=='_total'&&o[k]!==undefined;}).sort()
  .map(function(k){return JSON.stringify(k)+':'+estable(o[k]);}).join(',')+'}';
 return JSON.stringify(o);}
function haceCuanto(t){var m=Math.round((Date.now()-new Date(t).getTime())/60000);return isNaN(m)?'':(m<1?'recién':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h');}
function marca(h){var m=el('sbMarca');if(m)m.innerHTML=h;}
function numBusca(q,nums){var d=String(q).replace(/\D/g,'');if(d.length<4||/[a-záéíóúñ]/i.test(q))return false;d=d.replace(/^595/,'').replace(/^0+/,'');if(d.length<3)return false;
 return String(nums||'').split(' ').some(function(t){return t&&t.indexOf(d)>=0;});}   // 🔎 buscar por CI o celular
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return (n<0?'− ':'')+'Gs. '+Math.abs(Math.round(n)).toLocaleString('es-PY');}
function num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}
function fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):(/0/.test(i.value)?'0':'');}   // se puede escribir 0
function hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}

function pedir(acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 var t0=Date.now();
 fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&typeof d==='object')d._total=Date.now()-t0;if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con Administración. Revisá la conexión y probá de nuevo.'});});
}
function error(e){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\s*/,''));return;}
 el('msg').innerHTML='<span class="err">⚠️ '+esc(m)+'</span>';}
function pedirPin(m){
 el('ficha').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Pagos</h2>'+
  '<div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
  '<input id="pin" type="password" placeholder="PIN" style="font-size:20px;padding:10px;width:170px;text-align:center;border:1px solid #ccc;border-radius:8px">'+
  '<br><button onclick="entrar()" class="btn" style="width:auto;display:inline-block;margin-top:12px;padding:10px 28px">Entrar</button></div>';
 el('msg').textContent='';var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinSec',PIN);el('ficha').innerHTML='';cargar();}

function cargar(){el('msg').textContent='Cargando alumnos…';
 function listo(){if(!F)el('msg').textContent=L.alumnos.length+' alumnos. Escribí arriba para buscar.';el('q').focus();cargarPend();}
 sbLeer('pagosLista','todo',function(d){L=d;listo();
   // confirma con la planilla sin hacer esperar
   pedir('lista',{},function(d2){L=d2;if(el('res').style.display==='block')filtrar();},function(e){if(String(e.message||'').indexOf('PIN:')>=0)error(e);});},
  function(){pedir('lista',{},function(d){L=d;listo();},error);});}
var PEND=null,ULTFAC='';
function cargarPend(){var ap=function(d){PEND=d.pend;ULTFAC=d.ultFactura||ULTFAC;pintarPend();},pl=function(){pedir('pendFacturas',{},ap,function(){});};
 sbLeer('pagosPend','todo',function(d){ap(d);pl();},pl);}
function pintarPend(){var b=el('pend');if(!PEND||!PEND.length){b.innerHTML='';return;}
 b.innerHTML='<div class="card y" style="cursor:pointer" onclick="var l=document.getElementById(\'pendL\');l.style.display=l.style.display===\'none\'?\'block\':\'none\';">'+
  '<b>🧾 '+PEND.length+' pago'+(PEND.length>1?'s':'')+' con FACTURA sin número</b> <span class="ayuda">(tocá para ver)</span>'+
  '<div id="pendL" style="display:none;margin-top:8px">'+PEND.map(function(x){return '<div style="padding:6px 0;border-top:1px solid #e8d9a8" onclick="event.stopPropagation();ver(\''+esc(x.id)+'\')">'+
   esc(x.nombre)+' · '+esc(x.fecha)+' · '+gs(x.monto)+' <span style="color:#1155cc">→ abrir</span></div>';}).join('')+'</div></div>';}
function sigFactura(u){var m=String(u||'').match(/^(\d{3}-\d{3}-)(\d+)$/);return m?m[1]+('0000000'+(Number(m[2])+1)).slice(-7):'';}
cargar();

function filtrar(){
 var q=sa(el('q').value.trim()),r=el('res');
 if(!L||q.length<2){r.style.display='none';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]+' '+x[2]);return p.every(function(w){return t.indexOf(w)>=0;})||numBusca(q,x[5]);}).slice(0,30);
 r.innerHTML=h.length?h.map(function(x){return '<div onclick="ver(\''+esc(x[0])+'\')"><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+' · '+esc(x[3])+'</small></span>'+
  '<span class="badge '+(x[4]>0?'bR':'bG')+'">'+(x[4]>0?'Debe '+gs(x[4]):'Al día')+'</span></div>';}).join(''):'<div class="vacio">No hay coincidencias</div>';
 r.style.display='block';}

// ◀ deslizar para atrás desde la ficha: vuelve al buscador
var VOLVIENDO=false;
window.addEventListener('popstate',function(e){var s=e.state;if(s&&s.ficha){VOLVIENDO=true;try{ver(s.ficha);}finally{VOLVIENDO=false;}return;}if(F||el('ficha').innerHTML)aInicio();});
// 🏠 Inicio: borra de la pantalla la ficha del alumno (deudas, pagos, datos)
function aInicio(){F=null;ULTIMO=null;el('ficha').innerHTML='';el('q').value='';el('res').style.display='none';el('bInicio').style.display='none';
 el('msg').textContent=L?L.alumnos.length+' alumnos. Escribí arriba para buscar.':'';pintarPend();window.scrollTo(0,0);el('q').focus();}
function ver(id,mantener){
 if(!mantener&&!VOLVIENDO&&window.history&&history.pushState){try{history.pushState({ficha:id},'');}catch(e){}}
 el('res').style.display='none';el('q').blur();el('bInicio').style.display='inline-block';
 if(!mantener)ULTIMO=null;
 el('ficha').innerHTML='';el('msg').textContent='Cargando…';
 var n=++VER_N;
 function dePlanilla(){pedir('ficha',{id:id},function(D){if(n===VER_N)pintar(D);},function(e){if(n===VER_N)error(e);});}
 if(mantener){el('msg').textContent='Cargando… (unos segundos)';dePlanilla();return;}   // después de guardar algo: siempre de la planilla
 sbLeer('pagosFicha',id,function(d,t){
   if(n!==VER_N)return;
   pintar(d);
   el('ficha').insertAdjacentHTML('afterbegin','<div id="sbMarca" class="ayuda" style="margin:-4px 0 8px">⚡ Vista rápida · confirmando con la planilla…</div>');
   pedir('ficha',{id:id},function(D){
     if(n!==VER_N)return;
     if(estable(D)===estable(F)){F.ultFactura=D.ultFactura;marca('✅ Confirmado con la planilla');setTimeout(function(){marca('');},2500);return;}
     if(!TOCADO){var y=window.scrollY;pintar(D);window.scrollTo(0,y);return;}
     F.ultFactura=D.ultFactura;NUEVO=D;
     marca('<span style="color:#b45f06;font-weight:bold">🔄 La planilla tiene datos más nuevos.</span> <button class="mini" onclick="var y=window.scrollY;pintar(NUEVO);window.scrollTo(0,y);">Actualizar</button>');
   },function(e){if(n!==VER_N)return;if(String(e.message||'').indexOf('PIN:')>=0){error(e);return;}
     marca('<span style="color:#c0392b">⚠️ No se pudo confirmar con la planilla (se ve la vista rápida).</span>');});
 },function(){if(n===VER_N){el('msg').textContent='Cargando… (unos segundos)';dePlanilla();}});}
// si la secretaria empieza a tocar la ficha (abrir un formulario, escribir), no se la redibuja sola
el('ficha').addEventListener('input',function(){TOCADO=true;});
el('ficha').addEventListener('click',function(ev){if(ev.target&&ev.target.closest&&!ev.target.closest('#sbMarca'))TOCADO=true;});

function k(t,v,cl){return '<div class="k '+(cl||'')+'"><span>'+esc(t)+'</span><b>'+esc(v===''||v==null?'–':v)+'</b></div>';}
function colorEstado(e){return e==='Sin costo'?'b':e==='Pagado'||e==='Perdonada'?'g':(e==='Vencido'?'r':(e==='Parcial'||e==='En espera'?'y':''));}

function pintar(D){F=D;TOCADO=false;el('msg').textContent='';
 if(L){var lx=L.alumnos.filter(function(y){return y[0]===D.id;})[0];if(lx)lx[4]=D.deuda;}
 var h='';
 if(ULTIMO&&ULTIMO.id===D.id&&ULTIMO.msg)h+='<div class="ok"><b>✅ '+esc(ULTIMO.msg)+'</b></div>';
 else if(ULTIMO&&ULTIMO.id===D.id)h+='<div class="ok">'+(ULTIMO.fila?'<b>✅ Pago de '+gs(ULTIMO.monto)+' guardado en CAJA (fila '+ULTIMO.fila+').</b>':'')+
  (ULTIMO.perdon?'<div><b>✂️ Multa perdonada: '+gs(ULTIMO.perdon)+'</b> (anotada en AJUSTES).</div>':'')+
  '<div class="ayuda">La deuda de abajo ya incluye este pago. La hoja DEUDAS de la planilla se actualiza sola en 1 minuto.</div>'+
  (ULTIMO.fila?'<div style="margin-top:8px"><button class="btn btn2" id="bcU" onclick="comp('+ULTIMO.fila+',\''+esc(ULTIMO.clave)+'\',\'cU\',this)">🧾 Generar comprobante</button></div><div id="cU"></div>':'')+'</div>';
 h+='<div class="card"><p class="nom">'+esc(D.nombre)+'</p><div class="sub">'+esc(D.id)+' · '+esc(D.grupo||'sin grupo')+' · '+esc(D.situacion)+'</div>'+
  (D.revisar&&D.revisar.length?'<div class="y" style="border-radius:8px;padding:8px 10px;margin:8px 0">🔔 <b>Para revisar</b> (lo cargó el CSA): '+D.revisar.map(function(x){return esc(x.detalle);}).join(' · ')+
   '<div class="ayuda">Resolvelo desde el panel de secretaría → 🔔 Para revisar.</div></div>':'')+
  (D.ultimaVez?'<div class="sub">🙋 Vino por última vez el <b>'+esc(D.ultimaVez)+'</b></div>':'')+
  (D.inicioGauss?'<div class="sub">📅 En Gauss desde el <b>'+esc(D.inicioGauss)+'</b>'+(D.recorrido&&D.recorrido.length>1&&D.inicioGrupo&&D.inicioGrupo!==D.inicioGauss?' · en '+esc(D.grupo)+' desde el '+esc(D.inicioGrupo):'')+'</div>':'')+
  (D.recorrido&&D.recorrido.length>1?'<div class="sub" style="font-size:13px">Grupos: '+D.recorrido.map(function(r){return esc(r.grupo)+' ('+esc(r.inicio||'?')+(r.salida?' → '+esc(r.salida):'')+')';}).join(' · ')+'</div>':'')+
  (D.plan?'<div class="sub">Plan: '+esc(D.plan)+'</div>':'')+
  '<div class="sub" style="font-size:13px">Celular: '+esc(D.cel||'–')+' · Responsable: '+esc(D.resp||'–')+' '+esc(D.celResp||'')+'</div>'+
  '<div class="grid">'+k('Deuda vencida',D.deuda>0?gs(D.deuda):'Al día',D.deuda>0?'r':'g')+
  (D.multas>0?k('De eso, multas',gs(D.multas),'r'):'')+
  (D.impagas||(D.sueltas&&D.sueltas.length)?k('Pagos vencidos',(D.impagas||0)+(D.sueltas&&D.sueltas.length?' + multa de '+D.sueltas.map(function(x){return x.mes;}).join(', '):'')):'')+
  k('Próximo vencimiento',D.prox?D.prox.venc+' · '+gs(D.prox.monto):'')+
  (D.favor>0?k('Saldo a favor',gs(D.favor),'g'):'')+
  (D.ultima?k('Última cuota',D.ultima.venc+' · '+gs(D.ultima.monto),D.ultima.dias<28&&D.ultima.completa?'y':''):'')+'</div>'+
  (D.ultima&&D.ultima.dias<28?(D.ultima.completa
   ?'<div class="y" style="border-radius:8px;padding:10px;margin-top:10px">⚠️ <b>Ojo con la última cuota:</b> vence el '+esc(D.ultima.venc)+' y el grupo termina el '+esc(D.ultima.fin)+
    ', o sea que cubre solo <b>'+D.ultima.dias+' días</b>, y se está cobrando completa ('+gs(D.ultima.monto)+').'
   :'<div style="background:#f3f3f3;border-radius:8px;padding:10px;margin-top:10px">ℹ️ La última cuota (vence el '+esc(D.ultima.venc)+') cubre '+D.ultima.dias+' días y '+(D.ultima.monto>0?'ya está reducida: '+gs(D.ultima.monto)+'.':'<b>no se cobra (Gs. 0, sin costo)</b>.'))+
   '<div style="margin-top:8px"><button class="mini" style="font-size:14px;padding:7px 12px" onclick="formUltima()">📅 Cambiar última cuota</button></div><div id="fu"></div></div>':'')+
  cartelesEspera()+
  '<div style="margin-top:12px"><button class="btn" onclick="formPago()">💵 Cargar pago</button></div><div id="fp"></div>'+
  '<div style="margin-top:8px"><button class="btn btn2" style="font-size:15px;padding:10px" onclick="formAjuste()">✂️ Ajuste (descuento, perdón de cuota o multa…)</button></div><div id="fa"></div>'+
  '<div style="margin-top:8px"><button class="btn" style="font-size:15px;padding:10px;background:#b7950b" onclick="formEspera()">⏳ Espera de cuotas (sin multa hasta una fecha)</button></div><div id="fe"></div>'+
  (D.cuotaPlan?'<div style="margin-top:8px"><button class="btn" style="font-size:15px;padding:10px;background:#1f6f8b" onclick="formCuota()">💲 Cambiar monto de cuota (corregir o cuota nueva)</button></div><div id="fq"></div>':'')+'</div>';
 // cuotas
 h+='<div class="card"><h2>📅 Cuotas</h2>';
 if(D.cuotas.length){h+='<div style="overflow-x:auto"><table><tr><th>Concepto</th><th>Vence</th><th class="n">Monto</th><th class="n">Multa</th><th class="n">Pagado</th><th class="n">Saldo</th><th>Estado</th></tr>';
  D.cuotas.forEach(function(c){h+='<tr><td>'+esc(c.concepto)+'</td><td>'+esc(c.vence)+'</td><td class="n">'+gs(c.monto)+'</td><td class="n">'+(c.multa?gs(c.multa):'–')+'</td>'+
   '<td class="n">'+(c.pagado?gs(c.pagado):'–')+'</td><td class="n">'+(c.saldo>0?gs(c.saldo):'–')+'</td><td class="'+colorEstado(c.estado)+'">'+esc(c.estado)+'</td></tr>';});
  h+='</table></div><div class="sub" style="font-size:12px">Se muestran las cuotas vencidas y la próxima. "Pagado" incluye la multa pagada.</div>';}
 else h+='<div class="vacio">No hay cuotas generadas.</div>';
 h+='</div>';
 // pagos
 h+='<div class="card"><h2>💰 Pagos que ya hizo</h2>';
 if(D.pagos.length){h+='<div style="overflow-x:auto"><table><tr><th>Fecha</th><th class="n">Monto</th><th>Medio</th><th>Concepto</th><th>Comprob.</th><th></th></tr>';
  D.pagos.forEach(function(p,i){
   if(p.anulado){h+='<tr style="color:#999"><td><s>'+esc(p.fecha)+'</s></td><td colspan="5"><s>'+esc(p.medio)+' · '+esc(p.tipo)+'</s><br><small style="color:#c0392b">🚫 '+esc(p.anulado)+'</small></td></tr>';return;}

var MOTOCADO=false;

// ---- 💸 multa pendiente: cartel y vista previa de cómo se reparte el pago (lo más viejo primero, primero la multa)
function pendVenc(){return ((F&&F.pend)||[]).filter(function(x){return x.vencida;});}
function multaInfo(){var l=pendVenc(),tot=0,meses=[];
 l.forEach(function(x){var m=(x.multa||0)+(x.resto?(x.cuota||0):0);if(m>0){tot+=m;if(meses.indexOf(x.mes)<0)meses.push(x.mes);}});
 return {tot:tot,meses:meses};}
function cartelMulta(){var mi=multaInfo();if(!(mi.tot>0)||!F.deuda)return '';
 var cuotas=pendVenc().filter(function(x){return !x.resto&&x.cuota>0;}),c0=cuotas[0],soloCuota=Math.max(0,F.deuda-mi.tot);
 return '<div class="r" style="border-radius:8px;padding:10px;margin-top:10px;border:2px solid #c0392b">⚠️ <b>Tiene '+gs(mi.tot)+' de multa</b> ('+esc(mi.meses.join(', '))+').'+
  (c0?' Si paga solo la cuota ('+gs(soloCuota)+'), <b>primero se cubre la multa</b> y la cuota de '+esc(c0.mes)+' queda debiendo '+gs(Math.min(mi.tot,soloCuota))+'.':'')+
  '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="mini" style="font-size:14px;padding:7px 12px;background:#c0392b;color:#fff;border:0" onclick="ponerMonto('+F.deuda+')">Cobrar todo · '+gs(F.deuda)+'</button>'+
  (soloCuota>0?'<button type="button" class="mini" style="font-size:14px;padding:7px 12px" onclick="ponerMonto('+soloCuota+')">Solo la cuota · '+gs(soloCuota)+'</button>':'')+'</div></div>';}
function ponerMonto(n){var i=el('mo');if(!i)return;i.value=n?Number(n).toLocaleString('es-PY'):'';MOTOCADO=true;previa();}
function previa(){var b=el('prev');if(!b||!F)return;var monto=num(val('mo')),pd=perdon(),l=((F.pend)||[]).map(function(x){return {mes:x.mes,concepto:x.concepto,cuota:x.cuota||0,multa:x.multa||0,resto:x.resto,vencida:x.vencida};});
 if(!l.length||!(monto>0)){b.innerHTML='';return;}
 l.forEach(function(x){if(pd>0&&x.multa>0){var q=Math.min(pd,x.multa);x.multa-=q;pd-=q;}});   // el perdón baja primero las multas
 var r=monto,lin=[],queda=0;
 l.forEach(function(x){if(r<=0){if(x.vencida)queda+=x.cuota+x.multa;return;}
  var aM=Math.min(r,x.multa);r-=aM;var aC=Math.min(r,x.cuota);r-=aC;
  if(aM>0)lin.push('<div>✅ Multa de '+esc(x.mes)+': '+gs(aM)+(aM<x.multa?' <span style="color:#c0392b">(queda '+gs(x.multa-aM)+')</span>':'')+'</div>');
  if(aC>0||x.cuota>0&&aM>0){var falta=x.cuota-aC;
   lin.push('<div>'+(falta>0?'⚠️':'✅')+' '+(x.resto?'Diferencia de '+esc(x.mes)+' (por la multa)':esc(x.concepto))+': '+gs(aC)+
    (falta>0?' <b style="color:#c0392b">→ queda debiendo '+gs(falta)+(x.vencida?'':'')+'</b>':(x.resto?'':' (completa)'))+'</div>');
   if(x.vencida)queda+=falta+(x.multa-aM);}
  else if(x.vencida)queda+=x.cuota+(x.multa-aM);});
 if(r>0)lin.push('<div>💚 Saldo a favor: '+gs(r)+'</div>');
 b.innerHTML='<div style="background:#f3f5f9;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px"><b>Este pago cubre:</b>'+lin.join('')+
  (queda>0?'<div style="margin-top:4px;color:#c0392b"><b>Después de este pago sigue debiendo '+gs(queda)+' vencido.</b></div>':'<div style="margin-top:4px;color:#1b8a3a"><b>Queda al día.</b></div>')+'</div>';}

function formAnular(i){var p=F.pagos[i];

 var D=F,monto=num(val('mo')),pd=perdon(),m=el('fm');
 if(!(monto>0)&&!(pd>0)){m.innerHTML='<div class="err">Escribí el monto.</div>';return;}

 var d={id:D.id,monto:monto,fecha:val('f'),fechaPago:val('fp2')&&val('fp2')!==val('f')?val('fp2'):'',medio:val('me'),tipo:val('ti'),cobro:val('co'),proc:val('pr'),

 pedir('pagar',d,function(r){FORZAR=false;ULTIMO={id:D.id,fila:r.fila,clave:r.clave,monto:monto,perdon:r.perdon||0};
   if(r.ficha&&r.ficha.id===D.id){el('msg').textContent='';pintar(r.ficha);setTimeout(cargarPend,1500);}else{cargarPend();ver(D.id,true);}},
  function(e){b.disabled=false;b.textContent='💾 Guardar pago';var t=String(e.message||e);
