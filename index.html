<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos · Gauss</title>
<style>
:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--verde:#1b8a3a;--borde:#e3e3e3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:15px}
header{background:var(--negro);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--rojo)}
header h1{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}header h1 b{flex:1;font-size:19px}
#bInicio{display:none;background:#444;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:bold}header h1 span{color:#ff6b5e}
#q{width:100%;font-size:17px;padding:11px 12px;border:0;border-radius:8px}
#res{background:#fff;border-radius:8px;margin-top:6px;max-height:60vh;overflow:auto;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#res div{padding:11px 12px;border-bottom:1px solid #eee;color:#222;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#res div:hover{background:#fdecea}#res small{color:#777}
.badge{font-size:12px;font-weight:bold;padding:3px 8px;border-radius:10px;white-space:nowrap;align-self:center}
.bR{background:#f4cccc;color:#990000}.bG{background:#d9ead3;color:#274e13}
main{padding:12px 16px 60px;max-width:860px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 8px;font-size:15px;color:var(--rojo)}
.nom{font-size:21px;font-weight:bold;margin:0}.sub{color:#555;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.k{background:var(--fondo);border-radius:8px;padding:8px}.k span{font-size:11px;color:#666;text-transform:uppercase}.k b{display:block;font-size:18px;margin-top:2px}
.r{background:#f4cccc}.y{background:#fff2cc}.g{background:#d9ead3}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--negro);color:#fff;text-align:left;padding:6px}
td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}.n{text-align:right;white-space:nowrap}
.btn{display:block;width:100%;font-size:17px;padding:13px;background:var(--rojo);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:.6}.btn2{background:var(--negro)}
.mini{font-size:12px;padding:4px 8px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
form label{display:block;font-weight:bold;margin-top:10px;font-size:13px}
form input,form select{width:100%;font-size:16px;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:3px;background:#fff}
.fila{display:flex;gap:10px}.fila>div{flex:1}
@media(max-width:560px){.fila{flex-direction:column;gap:0}}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:9px 14px;border-radius:18px;margin:8px 8px 0 0;font-weight:bold;font-size:14px}
.wa.gr{background:#555}.wa.az{background:#1f4e79}
.ok{background:#d9ead3;border-radius:10px;padding:12px;margin-bottom:12px}
.err{color:var(--rojo);font-weight:bold;margin-top:8px}
.vacio{color:#999;font-style:italic}
#msg{color:#666;text-align:center;margin-top:30px}
.ayuda{color:#777;font-size:12px;font-weight:normal}
</style></head><body>
<header><h1><b>💵 Pagos <span>Gauss</span></b><button id="bInicio" onclick="aInicio()">🏠 Inicio</button></h1>
<input id="q" placeholder="Buscá al alumno por nombre, apellido o ID…" autocomplete="off" oninput="filtrar()">
<div id="res"></div></header>
<main><div id="pend"></div><div id="ficha"></div><div id="msg">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var PIN='';try{PIN=localStorage.getItem('gaussPinSec')||'';}catch(e){}
var L=null,F=null,ULTIMO=null;
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return (n<0?'− ':'')+'Gs. '+Math.abs(Math.round(n)).toLocaleString('es-PY');}
function num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}
function fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):'';}
function hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}

function pedir(acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 var t0=Date.now();
 fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&typeof d==='object')d._total=Date.now()-t0;if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con Administración. Revisá la conexión y probá de nuevo.'});});
}
function error(e){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\s*/,''));return;}
 el('msg').innerHTML='<span class="err">⚠️ '+esc(m)+'</span>';}
function pedirPin(m){
 el('ficha').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Pagos</h2>'+
  '<div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
  '<input id="pin" type="password" placeholder="PIN" style="font-size:20px;padding:10px;width:170px;text-align:center;border:1px solid #ccc;border-radius:8px">'+
  '<br><button onclick="entrar()" class="btn" style="width:auto;display:inline-block;margin-top:12px;padding:10px 28px">Entrar</button></div>';
 el('msg').textContent='';var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinSec',PIN);el('ficha').innerHTML='';cargar();}

function cargar(){el('msg').textContent='Cargando alumnos… (unos segundos)';
 pedir('lista',{},function(d){L=d;el('msg').textContent=d.alumnos.length+' alumnos. Escribí arriba para buscar.';el('q').focus();cargarPend();},error);}
var PEND=null,ULTFAC='';
function cargarPend(){pedir('pendFacturas',{},function(d){PEND=d.pend;ULTFAC=d.ultFactura||ULTFAC;pintarPend();},function(){});}
function pintarPend(){var b=el('pend');if(!PEND||!PEND.length){b.innerHTML='';return;}
 b.innerHTML='<div class="card y" style="cursor:pointer" onclick="var l=document.getElementById(\'pendL\');l.style.display=l.style.display===\'none\'?\'block\':\'none\';">'+
  '<b>🧾 '+PEND.length+' pago'+(PEND.length>1?'s':'')+' con FACTURA sin número</b> <span class="ayuda">(tocá para ver)</span>'+
  '<div id="pendL" style="display:none;margin-top:8px">'+PEND.map(function(x){return '<div style="padding:6px 0;border-top:1px solid #e8d9a8" onclick="event.stopPropagation();ver(\''+esc(x.id)+'\')">'+
   esc(x.nombre)+' · '+esc(x.fecha)+' · '+gs(x.monto)+' <span style="color:#1155cc">→ abrir</span></div>';}).join('')+'</div></div>';}
function sigFactura(u){var m=String(u||'').match(/^(\d{3}-\d{3}-)(\d+)$/);return m?m[1]+('0000000'+(Number(m[2])+1)).slice(-7):'';}
cargar();

function filtrar(){
 var q=sa(el('q').value.trim()),r=el('res');
 if(!L||q.length<2){r.style.display='none';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]+' '+x[2]);return p.every(function(w){return t.indexOf(w)>=0;});}).slice(0,30);
 r.innerHTML=h.length?h.map(function(x){return '<div onclick="ver(\''+esc(x[0])+'\')"><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+' · '+esc(x[3])+'</small></span>'+
  '<span class="badge '+(x[4]>0?'bR':'bG')+'">'+(x[4]>0?'Debe '+gs(x[4]):'Al día')+'</span></div>';}).join(''):'<div class="vacio">No hay coincidencias</div>';
 r.style.display='block';}

// 🏠 Inicio: borra de la pantalla la ficha del alumno (deudas, pagos, datos)
function aInicio(){F=null;ULTIMO=null;el('ficha').innerHTML='';el('q').value='';el('res').style.display='none';el('bInicio').style.display='none';
 el('msg').textContent=L?L.alumnos.length+' alumnos. Escribí arriba para buscar.':'';pintarPend();window.scrollTo(0,0);el('q').focus();}
function ver(id,mantener){
 el('res').style.display='none';el('q').blur();el('bInicio').style.display='inline-block';
 if(!mantener)ULTIMO=null;
 el('ficha').innerHTML='';el('msg').textContent='Cargando… (unos segundos)';
 pedir('ficha',{id:id},pintar,error);}

function k(t,v,cl){return '<div class="k '+(cl||'')+'"><span>'+esc(t)+'</span><b>'+esc(v===''||v==null?'–':v)+'</b></div>';}
function colorEstado(e){return e==='Pagado'||e==='Perdonada'?'g':(e==='Vencido'?'r':(e==='Parcial'?'y':''));}

function pintar(D){F=D;el('msg').textContent='';
 if(L){var lx=L.alumnos.filter(function(y){return y[0]===D.id;})[0];if(lx)lx[4]=D.deuda;}
 var h='';
 if(ULTIMO&&ULTIMO.id===D.id&&ULTIMO.msg)h+='<div class="ok"><b>✅ '+esc(ULTIMO.msg)+'</b></div>';
 else if(ULTIMO&&ULTIMO.id===D.id)h+='<div class="ok">'+(ULTIMO.fila?'<b>✅ Pago de '+gs(ULTIMO.monto)+' guardado en CAJA (fila '+ULTIMO.fila+').</b>':'')+
  (ULTIMO.perdon?'<div><b>✂️ Multa perdonada: '+gs(ULTIMO.perdon)+'</b> (anotada en AJUSTES).</div>':'')+
  '<div class="ayuda">La deuda de abajo ya incluye este pago. La hoja DEUDAS de la planilla se actualiza sola en 1 minuto.</div>'+
  (ULTIMO.fila?'<div style="margin-top:8px"><button class="btn btn2" id="bcU" onclick="comp('+ULTIMO.fila+',\''+esc(ULTIMO.clave)+'\',\'cU\',this)">🧾 Generar comprobante</button></div><div id="cU"></div>':'')+'</div>';
 h+='<div class="card"><p class="nom">'+esc(D.nombre)+'</p><div class="sub">'+esc(D.id)+' · '+esc(D.grupo||'sin grupo')+' · '+esc(D.situacion)+'</div>'+
  (D.plan?'<div class="sub">Plan: '+esc(D.plan)+'</div>':'')+
  '<div class="sub" style="font-size:13px">Celular: '+esc(D.cel||'–')+' · Responsable: '+esc(D.resp||'–')+' '+esc(D.celResp||'')+'</div>'+
  '<div class="grid">'+k('Deuda vencida',D.deuda>0?gs(D.deuda):'Al día',D.deuda>0?'r':'g')+
  (D.multas>0?k('De eso, multas',gs(D.multas),'r'):'')+
  (D.impagas?k('Pagos vencidos',D.impagas):'')+
  k('Próximo vencimiento',D.prox?D.prox.venc+' · '+gs(D.prox.monto):'')+
  (D.favor>0?k('Saldo a favor',gs(D.favor),'g'):'')+
  (D.ultima?k('Última cuota',D.ultima.venc+' · '+gs(D.ultima.monto),D.ultima.dias<28&&D.ultima.completa?'y':''):'')+'</div>'+
  (D.ultima&&D.ultima.dias<28?(D.ultima.completa
   ?'<div class="y" style="border-radius:8px;padding:10px;margin-top:10px">⚠️ <b>Ojo con la última cuota:</b> vence el '+esc(D.ultima.venc)+' y el grupo termina el '+esc(D.ultima.fin)+
    ', o sea que cubre solo <b>'+D.ultima.dias+' días</b>, y se está cobrando completa ('+gs(D.ultima.monto)+').'
   :'<div style="background:#f3f3f3;border-radius:8px;padding:10px;margin-top:10px">ℹ️ La última cuota (vence el '+esc(D.ultima.venc)+') cubre '+D.ultima.dias+' días y ya está reducida: '+gs(D.ultima.monto)+'.')+
   '<div style="margin-top:8px"><button class="mini" style="font-size:14px;padding:7px 12px" onclick="formUltima()">📅 Cambiar última cuota</button></div><div id="fu"></div></div>':'')+
  '<div style="margin-top:12px"><button class="btn" onclick="formPago()">💵 Cargar pago</button></div><div id="fp"></div>'+
  '<div style="margin-top:8px"><button class="btn btn2" style="font-size:15px;padding:10px" onclick="formAjuste()">✂️ Ajuste (descuento, perdón de cuota o multa…)</button></div><div id="fa"></div></div>';
 // cuotas
 h+='<div class="card"><h2>📅 Cuotas</h2>';
 if(D.cuotas.length){h+='<div style="overflow-x:auto"><table><tr><th>Concepto</th><th>Vence</th><th class="n">Monto</th><th class="n">Multa</th><th class="n">Pagado</th><th class="n">Saldo</th><th>Estado</th></tr>';
  D.cuotas.forEach(function(c){h+='<tr><td>'+esc(c.concepto)+'</td><td>'+esc(c.vence)+'</td><td class="n">'+gs(c.monto)+'</td><td class="n">'+(c.multa?gs(c.multa):'–')+'</td>'+
   '<td class="n">'+(c.pagado?gs(c.pagado):'–')+'</td><td class="n">'+(c.saldo>0?gs(c.saldo):'–')+'</td><td class="'+colorEstado(c.estado)+'">'+esc(c.estado)+'</td></tr>';});
  h+='</table></div><div class="sub" style="font-size:12px">Se muestran las cuotas vencidas y la próxima. "Pagado" incluye la multa pagada.</div>';}
 else h+='<div class="vacio">No hay cuotas generadas.</div>';
 h+='</div>';
 // pagos
 h+='<div class="card"><h2>💰 Pagos que ya hizo</h2>';
 if(D.pagos.length){h+='<div style="overflow-x:auto"><table><tr><th>Fecha</th><th class="n">Monto</th><th>Medio</th><th>Concepto</th><th>Comprob.</th><th></th></tr>';
  D.pagos.forEach(function(p,i){h+='<tr><td>'+esc(p.fecha)+(p.carga&&p.carga!==p.fecha?'<br><small style="color:#888">cargado '+esc(p.carga)+'</small>':'')+'</td>'+
   '<td class="n">'+gs(p.monto)+'</td><td>'+esc(p.medio)+'</td><td>'+esc(p.tipo)+'</td><td>'+(p.num?esc(p.comp):(sa(p.tipoComp)==='factura'?'<span style="color:#b7950b">FACTURA sin N°</span><br>':esc(p.tipoComp)+' ')+
    '<button class="mini" onclick="formFactura('+i+')">➕ N° factura</button>')+'</td>'+
   '<td><button class="mini" onclick="comp('+p.fila+',\''+esc(p.clave)+'\',\'cp'+i+'\',this)">🧾</button></td></tr>'+
   '<tr><td colspan="6" id="cp'+i+'" style="border:0;padding:0"></td></tr>';});
  h+='</table></div><div class="sub" style="font-size:12px">🧾 = generar el comprobante interno de ese pago. ➕ N° factura = cargar el número de la factura hecha en el sistema de facturación.</div>';}
 else h+='<div class="vacio">Todavía no hay pagos.</div>';
 h+='</div>';
 // anotaciones (las que escriben en DEUDAS → ✍️ ANOTACIÓN)
 h+='<div class="card"><h2>📝 Anotaciones</h2>';
 if(D.anotaciones&&D.anotaciones.length){h+='<table><tr><th>Fecha</th><th>Anotación</th></tr>';
  D.anotaciones.forEach(function(c){h+='<tr><td style="white-space:nowrap">'+esc(c.fecha)+'</td><td>'+esc(c.obs)+'</td></tr>';});h+='</table>';}
 else h+='<div class="vacio">Sin anotaciones.</div>';
 h+='</div>';
 // ajustes
 h+='<div class="card"><h2>✂️ Descuentos y ajustes</h2>';
 if(D.ajustes.length){h+='<table><tr><th>Fecha</th><th>Tipo</th><th class="n">Monto</th></tr>';
  D.ajustes.forEach(function(a){h+='<tr><td>'+esc(a.fecha)+'</td><td>'+esc(a.tipo)+(a.mes?' '+esc(a.mes):'')+'</td><td class="n">'+gs(a.monto)+'</td></tr>';});
  h+='</table>';}
 else h+='<div class="vacio">No tiene.</div>';
 h+='</div><div class="vacio" style="text-align:center;font-size:12px">Datos de Administración, al momento de abrir la ficha.'+
  (D._total?' Cargó en '+(D._total/1000).toFixed(1).replace('.',',')+' s'+(D._ms?' (servidor '+(D._ms/1000).toFixed(1).replace('.',',')+' s)':'')+'.':'')+'</div>';
 el('ficha').innerHTML=h;window.scrollTo(0,0);
}

function opts(l,def,vacia){return (vacia?'<option value=""></option>':'')+l.map(function(x){return '<option'+(x===def?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function formPago(){
 var o=L.opciones,hay=L.hay,D=F;
 var sug=D.deuda>0?D.deuda:(D.prox?D.prox.monto:0);
 var tipoDef=(o.tipo.filter(function(t){return /CUOTA|MATR/i.test(t);})[0])||'';
 var procDef=guardado('gaussSecProc')||(o.proc.filter(function(p){return sa(p)===sa(L.oficina);})[0])||'';
 var h='<form onsubmit="guardar(event)">'+
  (D.multas>0?'<div style="background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px">'+
   '<label style="margin:0"><input id="pm" type="checkbox" style="width:auto" onchange="perdonar()"> ✂️ Perdonar multa <span class="ayuda">(debe '+gs(D.multas)+' de multa)</span></label>'+
   '<div id="pmBox" style="display:none"><div class="fila"><div><label>Multa a perdonar (Gs.)</label><input id="pmM" inputmode="numeric" value="'+Number(D.multas).toLocaleString('es-PY')+'" oninput="fmt(this);perdonar()"></div>'+
   '<div><label>Autorizó <span class="ayuda">(opcional)</span></label><input id="pmA"></div></div></div></div>':'')+
  '<label>Monto que paga (Gs.)</label><input id="mo" inputmode="numeric" value="'+(sug?Number(sug).toLocaleString('es-PY'):'')+'" oninput="fmt(this);MOTOCADO=true">'+
  '<div class="fila"><div><label>Fecha de carga <span class="ayuda">(día en que entra a la caja)</span></label><input id="f" type="date" value="'+hoyIso()+'" max="'+hoyIso()+'"></div>'+
  (hay.fechaPago?'<div><label>Fecha de pago <span class="ayuda">(vacía = la misma que la de carga)</span></label><input id="fp2" type="date" max="'+hoyIso()+'"></div>':'')+'</div>'+
  '<div class="fila">'+(hay.medio?'<div><label>Medio</label><select id="me">'+opts(o.medio,'',true)+'</select></div>':'')+
  (hay.tipo?'<div><label>Concepto</label><select id="ti">'+opts(o.tipo,tipoDef,true)+'</select></div>':'')+'</div>'+
  '<div class="fila">'+(hay.cobro?'<div><label>Cobró</label><select id="co">'+opts(o.cobro,guardado('gaussSecCobro'),true)+'</select></div>':'')+
  (hay.proc?'<div><label>Procesado en</label><select id="pr">'+opts(o.proc,procDef,true)+'</select></div>':'')+'</div>'+
  '<div class="fila">'+(hay.tipoComp?'<div><label>Comprobante</label><select id="tc" onchange="compCambio()">'+opts(o.tipoComp,'',true)+'</select></div>':'')+
  (hay.comp?'<div id="dCm" style="display:none"><label id="lCm">N° comprobante</label><input id="cm"><div id="sCm" class="ayuda"></div></div>':'')+'</div>'+
  '<div id="dFac" style="display:none">'+cajaFact('pf')+'</div>'+
  (hay.entregado?'<label style="font-weight:normal;margin-top:12px"><input id="en" type="checkbox" style="width:auto"> Comprobante ya entregado</label>':'')+
  (hay.obs?'<label>Observaciones <span class="ayuda">(opcional)</span></label><input id="ob">':'')+
  '<div style="margin-top:14px"><button class="btn" id="bg" type="submit">💾 Guardar pago</button></div><div id="fm"></div></form>';
 el('fp').innerHTML=h;MOTOCADO=false;el('mo').focus();
}
function val(id){var e=el(id);return e?e.value:'';}
// ---- ✂️ ajustes (van a la hoja AJUSTES)
function formAjuste(){var tipos=(L.opciones.ajustes&&L.opciones.ajustes.length)?L.opciones.ajustes:['Descuento','Perdón de cuota','Perdón de multa','Recargo','Otro'];
 var meses=F.cuotas.map(function(c){var m=String(c.concepto).match(/Cuota\s+([a-z]{3}-\d{4})/i);return m?m[1]:'';}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
 el('fa').innerHTML='<div style="background:#f3f3f3;border-radius:8px;padding:10px;margin-top:8px">'+
  '<label>Tipo de ajuste</label><select id="aT" onchange="ajTipo()">'+opts(tipos,'',true)+'</select>'+
  '<div id="aMesD" style="display:none"><label>¿De qué cuota?</label><select id="aMes">'+opts(meses,'',true)+'</select>'+
   '<div class="ayuda">Si la cuota no aparece, es porque todavía no venció: esperá a que esté en la lista.</div></div>'+
  '<label id="aML">Monto (Gs.)</label><input id="aM" inputmode="numeric" oninput="fmt(this)">'+
  '<div class="fila"><div><label>Motivo</label><input id="aMo"></div><div><label>Autorizó</label><input id="aA"></div></div>'+
  '<button class="btn" id="aB" style="margin-top:10px" onclick="guardarAjuste()">💾 Guardar ajuste</button><div id="aMsg"></div></div>';}
function ajTipo(){var t=sa(val('aT')),pc=t.indexOf('perdon de cuota')===0,ds=t.indexOf('descuento')===0;
 el('aMesD').style.display=pc||ds?'block':'none';
 el('aML').innerHTML='Monto (Gs.)'+(pc?' <span class="ayuda">(vacío = la cuota entera)</span>':(ds?' <span class="ayuda">(si elegís la cuota, se descuenta de esa)</span>':''));}
function guardarAjuste(){var t=val('aT'),m=el('aMsg'),monto=num(val('aM')),mes=el('aMesD').style.display==='block'?val('aMes'):'';
 if(!t){m.innerHTML='<div class="err">Elegí el tipo.</div>';return;}
 if(sa(t).indexOf('perdon de cuota')===0&&!mes){m.innerHTML='<div class="err">Elegí de qué cuota.</div>';return;}
 if(!monto&&sa(t).indexOf('perdon de cuota')!==0){m.innerHTML='<div class="err">Falta el monto.</div>';return;}
 if(!confirm(F.nombre+':\n'+t+(mes?' de la cuota '+mes:'')+(monto?' por '+gs(monto):' (cuota entera)')+'\n\n¿Confirmás?'))return;
 var b=el('aB');b.disabled=true;b.textContent='Guardando…';
 pedir('ajuste',{id:F.id,tipo:t,monto:monto||'',mes:mes,motivo:val('aMo'),autorizo:val('aA'),nonce:Date.now()+'-'+Math.random().toString(36).slice(2)},
  function(r){ULTIMO={id:F.id,msg:r.msg+' La deuda se actualiza en 1 minuto.'};ver(F.id,true);},
  function(e){b.disabled=false;b.textContent='💾 Guardar ajuste';var x=String(e.message||e);if(x.indexOf('PIN:')>=0){error(e);return;}m.innerHTML='<div class="err">⚠️ '+esc(x)+'</div>';});}
// ---- datos de facturación (ALUMNOS → RUC, RAZÓN SOCIAL, CORREO FACTURA)
function copiar(t,b){try{navigator.clipboard.writeText(t);var x=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=x;},1200);}catch(e){}}
function cajaFact(k){var f=(F&&F.fact)||{};if(!f.hay)return '<div class="ayuda" style="margin-top:8px">Para guardar RUC y razón social, agregá las columnas RUC, RAZÓN SOCIAL y CORREO FACTURA en ALUMNOS.</div>';
 var cp=function(v){return v?' <button type="button" class="mini" onclick="copiar(\''+esc(v).replace(/'/g,"\\'")+'\',this)">📋</button>':'';};
 return '<div style="background:#eef4fb;border-radius:8px;padding:10px;margin-top:10px"><b style="font-size:14px">🧾 Datos para la factura</b>'+
  (f.ruc||f.razon?'<div style="font-size:14px;margin-top:4px">RUC: <b>'+esc(f.ruc||'–')+'</b>'+cp(f.ruc)+' · '+esc(f.razon||'–')+cp(f.razon)+(f.correo?'<br>Correo: '+esc(f.correo)+cp(f.correo):'')+'</div>':
   '<div class="ayuda">Todavía no tiene datos de facturación'+(f.ci?' (CI '+esc(f.ci)+')':'')+'. Cargalos acá y quedan guardados.</div>')+
  '<div class="fila"><div><label>RUC</label><input id="'+k+'Ruc" value="'+esc(f.ruc)+'" placeholder="'+esc(f.ci?f.ci:'ej. 4567890-1')+'"></div>'+
  '<div><label>Razón social</label><input id="'+k+'Raz" value="'+esc(f.razon)+'" placeholder="'+esc(F?F.nombre:'')+'"></div></div>'+
  '<label>Correo para la factura</label><input id="'+k+'Cor" type="email" value="'+esc(f.correo)+'"></div>';}
function factCambios(k){var f=(F&&F.fact)||{},o={};
 if(!el(k+'Ruc'))return o;
 if(val(k+'Ruc').trim()!==(f.ruc||''))o.ruc=val(k+'Ruc').trim();
 if(val(k+'Raz').trim()!==(f.razon||''))o.razon=val(k+'Raz').trim();
 if(val(k+'Cor').trim()!==(f.correo||''))o.correo=val(k+'Cor').trim();return o;}
function compCambio(){var d=el('dCm');if(!d)return;var t=sa(val('tc'));
 if(el('dFac'))el('dFac').style.display=t==='factura'?'block':'none';
 if(t==='factura'){d.style.display='block';el('lCm').innerHTML='N° de factura <span class="ayuda">(opcional: si todavía no la hiciste, después la cargás con ➕ N° factura)</span>';
  var sg=sigFactura((F&&F.ultFactura)||ULTFAC);el('cm').placeholder=sg?'ej. '+sg:'ej. 001-001-0002656';
  el('sCm').innerHTML=sg?'Última cargada: '+esc((F&&F.ultFactura)||ULTFAC)+'. Podés escribir solo los últimos números (ej. '+Number(sg.split('-')[2])+').':'';}
 else if(t==='recibo'){d.style.display='block';el('lCm').innerHTML='N° de recibo <span class="ayuda">(opcional)</span>';el('cm').placeholder='';el('sCm').innerHTML='';}
 else{d.style.display='none';el('cm').value='';}}
function formFactura(i){var p=F.pagos[i],sg=sigFactura(F.ultFactura||ULTFAC);
 el('cp'+i).innerHTML='<div style="background:#fff8e1;border-radius:8px;padding:10px;margin:4px 0">'+
  cajaFact('ff'+i)+'<b style="font-size:13px;display:block;margin-top:10px">N° de factura de este pago ('+gs(p.monto)+', '+esc(p.fecha)+')</b>'+
  '<input id="fn'+i+'" placeholder="'+(sg?'ej. '+sg:'ej. 001-001-0002656')+'" style="width:100%;font-size:16px;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:4px">'+
  '<div class="ayuda">'+(sg?'Última cargada: '+esc(F.ultFactura||ULTFAC)+'. Podés escribir solo los últimos números.':'Escribí el número completo, ej. 001-001-0002656.')+'</div>'+
  '<label style="font-size:13px;display:block;margin-top:6px"><input id="fe'+i+'" type="checkbox"> Factura ya entregada</label>'+
  '<button class="btn" style="margin-top:8px;font-size:15px;padding:10px" id="fb'+i+'" onclick="guardarFactura('+i+')">💾 Guardar N° de factura</button><div id="fm'+i+'"></div></div>';
 el('fn'+i).focus();}
function guardarFactura(i,forzar){var p=F.pagos[i],n=val('fn'+i).trim(),b=el('fb'+i);
 if(!n){el('fm'+i).innerHTML='<div class="err">Escribí el número.</div>';return;}
 b.disabled=true;b.textContent='Guardando…';
 var fc=factCambios('ff'+i);if(fc.ruc||fc.razon||fc.correo)pedir('facturacion',{id:F.id,ruc:fc.ruc||'',razon:fc.razon||'',correo:fc.correo||''},function(){},function(){});
 pedir('factura',{fila:p.fila,clave:p.clave,numero:n,entregado:el('fe'+i).checked?'1':'',forzar:forzar?'1':''},function(r){
   ULTIMO={id:F.id,msg:'Factura N° '+r.numero+' guardada en CAJA (fila '+r.fila+').'};ver(F.id,true);cargarPend();},
  function(e){b.disabled=false;b.textContent='💾 Guardar N° de factura';var t=String(e.message||e);
   if(t.indexOf('PIN:')>=0){error(e);return;}
   if(t.indexOf('REPETIDA:')===0){if(confirm(t.replace('REPETIDA: ','')+'\n\n¿Guardarlo igual?'))guardarFactura(i,true);return;}
   el('fm'+i).innerHTML='<div class="err">⚠️ '+esc(t)+'</div>';});}
function formUltima(){var u=F.ultima,prop=Math.round(u.cuota*u.dias/30/1000)*1000;
 el('fu').innerHTML='<div style="background:#fff;border-radius:8px;padding:10px;margin-top:8px">'+
  '<label style="display:block;margin-top:4px"><input type="radio" name="um" value="alumno" checked onchange="modoUltima()"> <b>Solo para este alumno</b></label>'+
  '<label style="display:block;margin-top:6px"><input type="radio" name="um" value="grupo" onchange="modoUltima()"> <b>Para todo el grupo</b> '+esc(u.grupoNombre)+'</label>'+
  '<div id="uA" style="margin-top:8px"><b style="font-size:13px">Monto de la última cuota (Gs.)</b>'+
   '<input id="uMa" inputmode="numeric" value="'+prop.toLocaleString('es-PY')+'" oninput="fmt(this)" style="width:100%;font-size:16px;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:3px">'+
   '<div class="ayuda">Proporcional a '+u.dias+' días de '+gs(u.cuota)+': '+gs(prop)+'. Vacío = se borra el monto propio y vale lo del grupo.</div></div>'+
  '<div id="uG" style="margin-top:8px;display:none"><b style="font-size:13px">% de la cuota (ej. 50) o monto fijo (ej. 125.000)</b>'+
   '<input id="uMg" inputmode="numeric" oninput="fmt(this)" style="width:100%;font-size:16px;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:3px">'+
   '<div class="ayuda">Hasta 100 = porcentaje de la cuota de cada alumno. Más de 100 = el mismo monto para todos. Vacío = cuota completa. Los alumnos con monto propio no cambian.</div></div>'+
  '<div style="margin-top:10px"><button class="btn" id="bu" onclick="guardarUltima()">💾 Guardar última cuota</button></div><div id="um"></div></div>';}
function modoUltima(){var g=document.querySelector('input[name=um]:checked').value==='grupo';el('uA').style.display=g?'none':'block';el('uG').style.display=g?'block':'none';}
function guardarUltima(){var D=F,modo=document.querySelector('input[name=um]:checked').value,v=modo==='grupo'?val('uMg'):val('uMa'),n=num(v);
 var txt=modo==='grupo'?(v===''?'que la última cuota del grupo '+D.ultima.grupoNombre+' vuelva a ser completa':'la última cuota del grupo '+D.ultima.grupoNombre+' = '+(n<=100?n+'% de la cuota':gs(n)+' para todos'))
  :(v===''?'borrar el monto propio de la última cuota de '+D.nombre:'la última cuota de '+D.nombre+' = '+gs(n));
 if(!confirm('¿Confirmás '+txt+'?'))return;
 var b=el('bu');b.disabled=true;b.textContent='Guardando…';
 pedir('ultima',{id:D.id,modo:modo,valor:v},function(r){ULTIMO={id:D.id,msg:r.msg};ver(D.id,true);},
  function(e){b.disabled=false;b.textContent='💾 Guardar última cuota';var t=String(e.message||e);if(t.indexOf('PIN:')>=0){error(e);return;}el('um').innerHTML='<div class="err">⚠️ '+esc(t)+'</div>';});}
var MOTOCADO=false;
function perdon(){return el('pm')&&el('pm').checked?num(val('pmM')):0;}
function perdonar(){var on=el('pm').checked;el('pmBox').style.display=on?'block':'none';
 if(!MOTOCADO&&F.deuda>0){var s=Math.max(0,F.deuda-perdon());el('mo').value=s?s.toLocaleString('es-PY'):'';}}
var FORZAR=false;
function guardar(ev){if(ev)ev.preventDefault();
 var D=F,monto=num(val('mo')),pd=perdon(),m=el('fm');
 if(!(monto>0)&&!(pd>0)){m.innerHTML='<div class="err">Escribí el monto.</div>';return;}
 if(pd>D.multas){m.innerHTML='<div class="err">No se puede perdonar más que la multa que debe ('+gs(D.multas)+').</div>';return;}
 if(monto>0&&L.hay.medio&&!val('me')){m.innerHTML='<div class="err">Elegí el medio de pago.</div>';return;}
 if(monto>0&&L.hay.proc&&!val('pr')){m.innerHTML='<div class="err">Elegí PROCESADO EN.</div>';return;}
 if(!val('f')){m.innerHTML='<div class="err">Falta la fecha de carga.</div>';return;}
 if(val('fp2')&&val('fp2')>val('f')){m.innerHTML='<div class="err">La fecha de pago no puede ser después de la fecha de carga.</div>';return;}
 if(!FORZAR&&!confirm(D.nombre+':\n'+(monto>0?'• Pago de '+gs(monto)+(val('me')?' ('+val('me')+')':'')+'\n':'')+(pd>0?'• Perdonar '+gs(pd)+' de multa\n':'')+'\n¿Confirmás?'))return;
 guardado('gaussSecCobro',val('co'));guardado('gaussSecProc',val('pr'));
 var b=el('bg');b.disabled=true;b.textContent='Guardando…';m.innerHTML='';
 var d={id:D.id,monto:monto,fecha:val('f'),fechaPago:val('fp2')&&val('fp2')!==val('f')?val('fp2'):'',medio:val('me'),tipo:val('ti'),cobro:val('co'),proc:val('pr'),
  tipoComp:val('tc'),comp:val('cm'),obs:val('ob'),forzar:FORZAR?'1':'',
  factRuc:sa(val('tc'))==='factura'?(factCambios('pf').ruc||''):'',factRazon:sa(val('tc'))==='factura'?(factCambios('pf').razon||''):'',factCorreo:sa(val('tc'))==='factura'?(factCambios('pf').correo||''):'',perdon:pd,autorizo:val('pmA'),entregado:el('en')&&el('en').checked?'1':'',nonce:Date.now()+'-'+Math.random().toString(36).slice(2)};
 pedir('pagar',d,function(r){FORZAR=false;ULTIMO={id:D.id,fila:r.fila,clave:r.clave,monto:monto,perdon:r.perdon||0};cargarPend();ver(D.id,true);},
  function(e){b.disabled=false;b.textContent='💾 Guardar pago';var t=String(e.message||e);
   if(t.indexOf('PIN:')>=0){error(e);return;}
   if(t.indexOf('REPETIDA:')===0){if(confirm(t.replace('REPETIDA: ','')+'\n\n¿Guardar el pago igual?')){FORZAR=true;guardar(null);}return;}
   FORZAR=false;m.innerHTML='<div class="err">⚠️ '+esc(t)+'</div>';});
}
function cargarLista(){pedir('lista',{},function(d){L=d;},function(){});}
function comp(fila,clave,dest,btn){
 btn.disabled=true;var txt=btn.textContent;btn.textContent='⏳';if(btn.classList.contains('btn'))btn.textContent='Generando… (unos segundos)';
 pedir('comprobante',{fila:fila,clave:clave},function(r){btn.disabled=false;btn.textContent=txt;
  el(dest).innerHTML='<div style="padding:8px 0">✅ <b>'+esc(r.numero)+'</b><br>'+
   '<a class="wa az" href="'+esc(r.ver)+'" target="_blank">👁️ Ver PDF</a><a class="wa gr" href="'+esc(r.bajar)+'" target="_blank">⬇️ Descargar</a>'+
   (r.waResp?'<a class="wa" href="'+esc(r.waResp)+'" target="_blank">📲 WhatsApp responsable</a>':'')+
   (r.waAl?'<a class="wa" href="'+esc(r.waAl)+'" target="_blank">📲 WhatsApp alumno</a>':'')+
   '<div class="ayuda" style="margin-top:6px">Descargá el PDF y adjuntalo en el chat que se abre.</div></div>';},
  function(e){btn.disabled=false;btn.textContent=txt;var t=String(e.message||e);
   if(t.indexOf('PIN:')>=0){error(e);return;}el(dest).innerHTML='<div class="err">⚠️ '+esc(t)+'</div>';});
}
